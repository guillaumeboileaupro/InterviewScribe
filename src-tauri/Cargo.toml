[package]
name = "interviewscribe"
version = "0.1.0"
description = "Local-first interview transcription"
authors = ["Guillaume Boileau"]
edition = "2021"

[lib]
name = "interviewscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
whisper-rs = "0.16"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4"] }
rubato = "5"
sha2 = "0.10"
tauri-plugin-dialog = "2"
regex = "1"
docx-rs = "0.4"
genpdf = "0.2"
which = "8"
pyannote-rs = "0.3"
# Pinned: pyannote-rs 0.3.4 was built against this exact rc; the newer
# 2.0.0-rc.13 that cargo resolves by default fails to compile (Send/Sync
# regression on OperatorDomain/ErasedOperator). Verified by real compilation
# before pinning - see docs/ARCHITECTURE.md "Diarisation".
ort = "=2.0.0-rc.10"
cpal = "0.18.2"
hound = "3.5.1"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fs = "2"
