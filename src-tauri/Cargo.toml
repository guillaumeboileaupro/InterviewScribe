[package]
name = "interviewscribe"
version = "0.1.2"
description = "Local-first interview transcription"
authors = ["Guillaume Boileau"]
edition = "2021"

[lib]
name = "interviewscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-utils = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
whisper-rs = "0.16"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4"] }
rubato = "5"
sha2 = "0.10"
tauri-plugin-dialog = "2"
regex = "1"
docx-rs = "0.4"
genpdf = "0.2"
which = "8"
cpal = "0.18.2"
hound = "3.5.1"
# Embedded WebDriver server for E2E testing only (docs/TEST_IMPLEMENTATION_PLAN.md
# section 2) - never compiled into a real build. A network-reachable automation
# server has no place in a local-first, offline-only app; only the `wdio-e2e`
# feature (enabled exclusively by e2e-linux/e2e-windows CI jobs, never
# release.yml) pulls it in.
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
# Companion plugin required by @wdio/tauri-service's command hooks (window
# focus tracking, execute/mock API) - distinct from tauri-plugin-wdio-webdriver
# above, which only provides the WebDriver HTTP transport. Without this one,
# every element/click command from the test runner stalls 5s waiting on a
# `window.__wdio_original_core__` reference that only this plugin's frontend
# half ever sets up (see apps/client/src/main.tsx). Same test-only gating.
tauri-plugin-wdio = { version = "1", optional = true }

[features]
wdio-e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fs = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
# Diarization (pyannote-rs/ort) is desktop-only: ort-sys's prebuilt-binary
# table publishes no Android artifact at all (verified by reading its
# build.rs - not a missing NDK/cmake toolchain issue, an actual gap in what
# upstream ships), so it must not even be compiled for that target, not just
# gated at the call site - see docs/ARCHITECTURE.md "Diarisation".
pyannote-rs = "0.3"
# Pinned: pyannote-rs 0.3.4 was built against this exact rc; the newer
# 2.0.0-rc.13 that cargo resolves by default fails to compile (Send/Sync
# regression on OperatorDomain/ErasedOperator). Verified by real compilation
# before pinning - see docs/ARCHITECTURE.md "Diarisation".
ort = "=2.0.0-rc.10"
