name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:packaging
      - run: pnpm test:privacy
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake clang libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Real E2E (docs/TEST_IMPLEMENTATION_PLAN.md item 2.5): drives the actual
  # installed application through @wdio/tauri-service's embedded WebDriver
  # provider (tauri-plugin-wdio-webdriver, only compiled in under the
  # `wdio-e2e` feature - never in a real build), never a simulated frontend -
  # see e2e/. Runs under Xvfb since this runner has no real display; xdotool
  # (native file dialog automation) works the same way under a virtual X
  # server as a real one.
  e2e-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri and E2E system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake clang libasound2-dev xdotool xvfb iptables
      - run: pnpm install --frozen-lockfile
      - name: Prepare bundled Whisper models (checksum verified)
        run: pnpm models:prepare
      - name: Build the desktop .deb (E2E test build - embedded WebDriver plugin included)
        env:
          VITE_WDIO_E2E: "true"
        run: pnpm tauri build --bundles deb --features wdio-e2e --config src-tauri/tauri.wdio-e2e.conf.json
      - name: Install the built package
        run: sudo dpkg -i src-tauri/target/release/bundle/deb/*.deb
      - name: Run E2E suite
        env:
          INTERVIEWSCRIBE_E2E_OFFLINE: "1"
        run: xvfb-run --auto-servernum pnpm test:e2e:linux

  # Windows counterpart to e2e-linux (item 2.6): same suite, same embedded
  # WebDriver provider (works identically cross-platform), native dialogs
  # driven via Win32 interop (scripts/native-dialog-windows.ps1) instead of
  # xdotool.
  e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Prepare bundled Whisper models (checksum verified)
        run: pnpm models:prepare
      - name: Build the desktop installer (E2E test build - embedded WebDriver plugin included)
        env:
          VITE_WDIO_E2E: "true"
        run: pnpm tauri build --bundles nsis --features wdio-e2e --config src-tauri/tauri.wdio-e2e.conf.json
      - name: Run E2E suite
        env:
          INTERVIEWSCRIBE_E2E_OFFLINE: "1"
        run: pnpm test:e2e:windows
