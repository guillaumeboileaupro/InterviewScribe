name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake clang libasound2-dev
      # GPU acceleration (whisper-rs "vulkan" feature, desktop-only - see
      # src-tauri/Cargo.toml) needs a Vulkan SDK newer than this distro ships
      # (verified by a real failed build locally against Ubuntu 22.04's
      # package). LunarG's own repository, keyed off the runner's actual
      # codename since `ubuntu-latest` can move (currently noble/24.04).
      - name: Install Vulkan SDK
        run: |
          set -euo pipefail
          codename=$(lsb_release -cs)
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO "/etc/apt/sources.list.d/lunarg-vulkan-$codename.list" "https://packages.lunarg.com/vulkan/lunarg-vulkan-$codename.list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          echo "VULKAN_SDK=/usr" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Run the mandatory project check
        run: pnpm check

  # Real E2E (docs/TEST_IMPLEMENTATION_PLAN.md item 2.5): drives the actual
  # installed application through @wdio/tauri-service's embedded WebDriver
  # provider (tauri-plugin-wdio-webdriver, only compiled in under the
  # `wdio-e2e` feature - never in a real build), never a simulated frontend -
  # see e2e/. Runs under Xvfb since this runner has no real display; xdotool
  # (native file dialog automation) works the same way under a virtual X
  # server as a real one.
  e2e-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri and E2E system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake clang libasound2-dev xdotool xvfb iptables
      - name: Install Vulkan SDK
        run: |
          set -euo pipefail
          codename=$(lsb_release -cs)
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO "/etc/apt/sources.list.d/lunarg-vulkan-$codename.list" "https://packages.lunarg.com/vulkan/lunarg-vulkan-$codename.list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          echo "VULKAN_SDK=/usr" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Prepare bundled Whisper models (checksum verified)
        run: pnpm models:prepare
      - name: Build the desktop .deb (E2E test build - embedded WebDriver plugin included)
        env:
          VITE_WDIO_E2E: "true"
        run: pnpm tauri build --bundles deb --features wdio-e2e --config src-tauri/tauri.wdio-e2e.conf.json
      - name: Install the built package
        run: sudo dpkg -i src-tauri/target/release/bundle/deb/*.deb
      - name: Run E2E suite
        env:
          INTERVIEWSCRIBE_E2E_OFFLINE: "1"
        run: xvfb-run --auto-servernum pnpm test:e2e:linux

  # Windows counterpart to e2e-linux (item 2.6): same suite, same embedded
  # WebDriver provider (works identically cross-platform), native dialogs
  # driven via Win32 interop (scripts/native-dialog-windows.ps1) instead of
  # xdotool.
  e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "1.4.313.0"
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          $sdkPath = "C:\VulkanSDK\$version"
          if (-not (Test-Path $sdkPath)) { throw "Vulkan SDK install did not produce $sdkPath" }
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH
      - run: pnpm install --frozen-lockfile
      - name: Prepare bundled Whisper models (checksum verified)
        run: pnpm models:prepare
      - name: Build the desktop installer (E2E test build - embedded WebDriver plugin included)
        env:
          VITE_WDIO_E2E: "true"
        run: pnpm tauri build --bundles nsis --features wdio-e2e --config src-tauri/tauri.wdio-e2e.conf.json
      - name: Run E2E suite
        env:
          INTERVIEWSCRIBE_E2E_OFFLINE: "1"
        run: pnpm test:e2e:windows
