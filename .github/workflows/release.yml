name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb"
          - platform: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - run: pnpm install --frozen-lockfile
      - name: Prepare bundled Whisper model (checksum verified)
        run: pnpm models:prepare
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "InterviewScribe ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify install and uninstall (Debian package)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n1)
          pkg=$(dpkg-deb -f "$deb" Package)
          sudo dpkg -i "$deb"
          dpkg -l "$pkg" | grep -q '^ii' || { echo "package $pkg is not reported as installed"; exit 1; }
          bin=$(dpkg -L "$pkg" | grep -E '^/usr/bin/' | head -n1)
          [ -x "$bin" ] || { echo "installed binary $bin is missing or not executable"; exit 1; }
          sudo dpkg -r "$pkg"
          if dpkg -l "$pkg" 2>/dev/null | grep -q '^ii'; then
            echo "$pkg is still reported as installed after removal"
            exit 1
          fi
          echo "install/uninstall verified for $pkg ($bin)"

      - name: Publish checksum (Debian package)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n1)
          checksum_file="$(basename "$deb").sha256"
          (cd "$(dirname "$deb")" && sha256sum "$(basename "$deb")") > "$checksum_file"
          gh release upload "${{ github.ref_name }}" "$checksum_file" --clobber

      - name: Verify install and uninstall (NSIS installer)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "no NSIS installer found" }

          # Force a known install path with NSIS's /D= (must be the last,
          # unquoted argument) so verification never has to guess where the
          # registry says the app landed.
          $installDir = "C:\InterviewScribeTest"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait

          $appExe = Get-ChildItem -Path $installDir -Filter "*.exe" -Recurse |
            Where-Object { $_.Name -notlike "*ninstall*" } | Select-Object -First 1
          if (-not $appExe) { throw "no application executable found under $installDir after install" }
          Write-Host "Installed: $($appExe.FullName)"

          $uninstaller = Get-ChildItem -Path $installDir -Filter "*ninstall*.exe" -Recurse | Select-Object -First 1
          if (-not $uninstaller) { throw "no uninstaller executable found under $installDir" }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $installDir) { throw "install directory still exists after uninstall: $installDir" }
          Write-Host "Uninstall verified: $installDir removed"

      - name: Publish checksum (NSIS installer)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          $hash = Get-FileHash -Path $installer.FullName -Algorithm SHA256
          $checksumFile = "$($installer.Name).sha256"
          "$($hash.Hash.ToLower())  $($installer.Name)" | Out-File -FilePath $checksumFile -Encoding ascii -NoNewline
          gh release upload "${{ github.ref_name }}" $checksumFile --clobber

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - run: pnpm install --frozen-lockfile
      - name: Prepare bundled Whisper model (checksum verified)
        run: pnpm models:prepare
      - name: Initialize Android project
        run: pnpm tauri android init --ci
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Apply release signing configuration
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/android-sign.sh "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        run: bash scripts/tauri-android.sh build --apk
      - name: Verify the APK is actually signed
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          build_tools=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)
          "$build_tools/apksigner" verify --print-certs "$apk"
          echo "signature verified: $apk"
      - uses: actions/upload-artifact@v4
        with:
          name: interviewscribe-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Publish checksum
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")") > "$(basename "$apk").sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: interviewscribe-android-apk-checksum
          path: "*.sha256"
          if-no-files-found: error
