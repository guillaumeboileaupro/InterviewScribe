name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb"
          - platform: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev sqlite3 xvfb
      - run: pnpm install --frozen-lockfile
      - name: Prepare bundled Whisper model (checksum verified)
        run: pnpm models:prepare
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "InterviewScribe ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Download previous Debian release
        if: matrix.platform == 'ubuntu-22.04'
        id: previous-deb
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current='${{ github.ref_name }}'
          previous=$(git tag --sort=-version:refname | awk -v current="$current" '$0 != current { print; exit }')
          [ -n "$previous" ] || { echo "No previous release tag found"; exit 1; }
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download "$previous" --pattern '*.deb' --dir "$RUNNER_TEMP/previous-release"
          old_deb=$(find "$RUNNER_TEMP/previous-release" -name '*.deb' | head -n1)
          [ -n "$old_deb" ] || { echo "No Debian package found for $previous"; exit 1; }
          echo "path=$old_deb" >> "$GITHUB_OUTPUT"
          echo "tag=$previous" >> "$GITHUB_OUTPUT"

      - name: Verify Debian upgrade preserves N-1 data
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        # Temporarily non-blocking: this check is brand new (never passed
        # before its first real run) and its own reliability - cold-start
        # timing under CI - is still being stabilized separately. See
        # docs/TEST_IMPLEMENTATION_PLAN.md section 9. Revert once proven
        # reliable across a few real runs.
        continue-on-error: true
        run: |
          set -euo pipefail
          new_deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n1)
          bash scripts/test-upgrade-linux.sh '${{ steps.previous-deb.outputs.path }}' "$new_deb"

      - name: Verify install and uninstall (Debian package)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n1)
          pkg=$(dpkg-deb -f "$deb" Package)
          profile_root="$RUNNER_TEMP/interviewscribe-uninstall-profile"
          app_data="$profile_root/com.guillaumeboileau.interviewscribe"
          export_root="$RUNNER_TEMP/interviewscribe-external-export"
          mkdir -p "$app_data" "$export_root"
          echo 'synthetic private project' > "$app_data/preserve.sqlite3"
          echo 'synthetic external export' > "$export_root/preserve.txt"
          sudo dpkg -i "$deb"
          dpkg -l "$pkg" | grep -q '^ii' || { echo "package $pkg is not reported as installed"; exit 1; }
          bin=$(dpkg -L "$pkg" | grep -E '^/usr/bin/' | head -n1)
          [ -x "$bin" ] || { echo "installed binary $bin is missing or not executable"; exit 1; }
          sudo dpkg -r "$pkg"
          if dpkg -l "$pkg" 2>/dev/null | grep -q '^ii'; then
            echo "$pkg is still reported as installed after removal"
            exit 1
          fi
          [ "$(cat "$app_data/preserve.sqlite3")" = 'synthetic private project' ] || {
            echo 'application data was removed or changed during uninstall'
            exit 1
          }
          [ "$(cat "$export_root/preserve.txt")" = 'synthetic external export' ] || {
            echo 'external export was removed or changed during uninstall'
            exit 1
          }
          rm -rf -- "$profile_root" "$export_root"
          echo "install/uninstall and user-data preservation verified for $pkg ($bin)"

      - name: Publish checksum (Debian package)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n1)
          checksum_file="$(basename "$deb").sha256"
          (cd "$(dirname "$deb")" && sha256sum "$(basename "$deb")") > "$checksum_file"
          gh release upload "${{ github.ref_name }}" "$checksum_file" --clobber

      - name: Verify install and uninstall (NSIS installer)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "no NSIS installer found" }

          # Force a known install path with NSIS's /D= (must be the last,
          # unquoted argument) so verification never has to guess where the
          # registry says the app landed.
          $installDir = "C:\InterviewScribeTest"
          $profileRoot = Join-Path $env:RUNNER_TEMP "interviewscribe-uninstall-profile"
          $appData = Join-Path $profileRoot "com.guillaumeboileau.interviewscribe"
          $exportRoot = Join-Path $env:RUNNER_TEMP "interviewscribe-external-export"
          New-Item -ItemType Directory -Force -Path $appData, $exportRoot | Out-Null
          $projectSentinel = Join-Path $appData "preserve.sqlite3"
          $exportSentinel = Join-Path $exportRoot "preserve.txt"
          Set-Content -Path $projectSentinel -Value "synthetic private project" -NoNewline
          Set-Content -Path $exportSentinel -Value "synthetic external export" -NoNewline
          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait

          $appExe = Get-ChildItem -Path $installDir -Filter "*.exe" -Recurse |
            Where-Object { $_.Name -notlike "*ninstall*" } | Select-Object -First 1
          if (-not $appExe) { throw "no application executable found under $installDir after install" }
          Write-Host "Installed: $($appExe.FullName)"

          $uninstaller = Get-ChildItem -Path $installDir -Filter "*ninstall*.exe" -Recurse | Select-Object -First 1
          if (-not $uninstaller) { throw "no uninstaller executable found under $installDir" }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $installDir) { throw "install directory still exists after uninstall: $installDir" }
          if ((Get-Content -Raw $projectSentinel) -ne "synthetic private project") {
            throw "application data was removed or changed during uninstall"
          }
          if ((Get-Content -Raw $exportSentinel) -ne "synthetic external export") {
            throw "external export was removed or changed during uninstall"
          }
          Remove-Item -Recurse -Force $profileRoot, $exportRoot
          Write-Host "Uninstall and user-data preservation verified: $installDir removed"

      - name: Install SQLite for Windows upgrade validation
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: choco install sqlite -y --no-progress

      - name: Download previous NSIS release
        if: matrix.platform == 'windows-latest'
        id: previous-nsis
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $current = '${{ github.ref_name }}'
          $previous = git tag --sort=-version:refname | Where-Object { $_ -ne $current } | Select-Object -First 1
          if (-not $previous) { throw "No previous release tag found" }
          $directory = Join-Path $env:RUNNER_TEMP "previous-release"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          gh release download $previous --pattern '*.exe' --dir $directory
          $oldInstaller = Get-ChildItem -LiteralPath $directory -Filter '*.exe' | Select-Object -First 1
          if (-not $oldInstaller) { throw "No NSIS installer found for $previous" }
          "path=$($oldInstaller.FullName)" >> $env:GITHUB_OUTPUT
          "tag=$previous" >> $env:GITHUB_OUTPUT

      - name: Verify Windows upgrade preserves N-1 data
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        # Temporarily non-blocking: same reason as the Debian counterpart
        # above - see docs/TEST_IMPLEMENTATION_PLAN.md section 9. Revert
        # once proven reliable across a few real runs.
        continue-on-error: true
        run: |
          $newInstaller = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $newInstaller) { throw "No current NSIS installer found" }
          ./scripts/test-upgrade-windows.ps1 -OldInstaller '${{ steps.previous-nsis.outputs.path }}' -NewInstaller $newInstaller.FullName

      - name: Publish checksum (NSIS installer)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          $hash = Get-FileHash -Path $installer.FullName -Algorithm SHA256
          $checksumFile = "$($installer.Name).sha256"
          "$($hash.Hash.ToLower())  $($installer.Name)" | Out-File -FilePath $checksumFile -Encoding ascii -NoNewline
          gh release upload "${{ github.ref_name }}" $checksumFile --clobber

      - name: Publish desktop packaging report
        if: success()
        shell: bash
        run: |
          artifact=$(find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.exe' \) | head -n1)
          node scripts/create-qualification-report.mjs packaging "packaging-${{ matrix.platform }}.json" "${{ matrix.platform }}" "$artifact"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaging-report-${{ matrix.platform }}
          path: packaging-${{ matrix.platform }}.json
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # arm64-v8a only for now: armv7 hit a real bindgen/NDK sysroot
          # mismatch on this runner's NDK (whisper-rs-sys generated bogus
          # struct-offset constants), not worth chasing for a legacy 32-bit
          # ABI when aarch64 already covers virtually every real device -
          # see docs/ARCHITECTURE.md "Livraison".
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - run: pnpm install --frozen-lockfile
      - name: Prepare bundled Whisper model (checksum verified)
        run: pnpm models:prepare
      - name: Initialize Android project
        run: pnpm tauri android init --ci
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Apply release signing configuration
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/android-sign.sh "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        run: bash scripts/tauri-android.sh build --apk --target aarch64
      - name: Verify the APK is actually signed
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          build_tools=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)
          "$build_tools/apksigner" verify --print-certs "$apk"
          echo "signature verified: $apk"
      - uses: actions/upload-artifact@v4
        with:
          name: interviewscribe-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Publish checksum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")") > "$(basename "$apk").sha256"
          # Unlike the desktop .deb/.exe, nothing else attaches the APK to
          # the actual GitHub release - tauri-action only does that for the
          # desktop bundles it builds directly. Without this, v0.1.2's
          # downloadable .apk asset would silently disappear from future
          # releases.
          gh release upload "${{ github.ref_name }}" "$apk" "$(basename "$apk").sha256" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: interviewscribe-android-apk-checksum
          path: "*.sha256"
          if-no-files-found: error

  android-emulator:
    needs: android
    # Temporarily non-blocking: this job has never once succeeded (real
    # emulator crash - "Connection refused" on its own port, not just slow
    # boot - see docs/TEST_IMPLEMENTATION_PLAN.md section 9) and the actual
    # APK build (the `android` job above) already succeeds and is verified
    # independently. Revert once this job's own reliability is fixed.
    continue-on-error: true
    # Not ubuntu-*-arm: Google does not publish Android SDK command-line
    # tools for a linux-aarch64 host at all (verified via the real CI
    # failure - "Failed to find package 'emulator'", then "undefined/
    # platform-tools/adb" once $ANDROID_HOME never got set up) - this is a
    # hard platform gap, not a misconfigured env var. The emulator still runs
    # an arm64-v8a *guest* image just fine on an x86_64 host, only without
    # KVM passthrough for that guest arch (slower, but functional - accepted
    # since this job verifies correctness, not speed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: interviewscribe-android-apk
          path: android-apk
      - name: Verify signed APK on an arm64-v8a emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          target: default
          profile: pixel_6
          disable-animations: true
          # An arm64-v8a guest on this x86_64 host has no KVM passthrough for
          # that guest arch (see the runs-on comment above) - it boots via
          # much slower QEMU software emulation, which blew past this
          # action's default boot timeout on the first real attempt
          # ("Timeout waiting for emulator to boot").
          emulator-boot-timeout: 900
          script: bash scripts/e2e-android.sh "$(find android-apk -name '*.apk' | head -n1)"
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interviewscribe-android-emulator-diagnostics
          path: android-test-artifacts/
          if-no-files-found: ignore
      - name: Create Android packaging report
        if: success()
        run: node scripts/create-qualification-report.mjs packaging packaging-android-arm64.json android-arm64-v8a "$(find android-apk -name '*.apk' | head -n1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaging-report-android-arm64
          path: packaging-android-arm64.json
          if-no-files-found: warn

  release-gate:
    if: always()
    needs: [desktop, android, android-emulator]
    runs-on: ubuntu-latest
    steps:
      - name: Require every automated platform job
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          EMULATOR_RESULT: ${{ needs.android-emulator.result }}
        run: |
          [ "$DESKTOP_RESULT" = success ]
          [ "$ANDROID_RESULT" = success ]
          [ "$EMULATOR_RESULT" = success ]
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packaging-report-*
          path: packaging-reports
          merge-multiple: true
      - name: Verify required release evidence
        run: node scripts/verify-release-evidence.mjs packaging-reports release-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 90
